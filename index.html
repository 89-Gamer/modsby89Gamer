<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aerofly mods by 89_Gamer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --text: #eaf4fb;
    --muted: #9db8cc;
    --sky: #7cc6ee;
    --gold: #f0c46a;
    --glass: rgba(255, 255, 255, 0.07);
    --glass-line: rgba(255, 255, 255, 0.16);
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --sans: "Jost", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { background: #000; }
  body {
    color: var(--text);
    font-family: var(--sans);
    font-weight: 300;
    line-height: 1.6;
    min-height: 100vh;
    position: relative;
  }
  /* Gradient background: dark sky blue at the top, black at the bottom */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background: linear-gradient(180deg, #0f5f90 0%, #0a4468 22%, #052437 50%, #020b12 78%, #000 100%);
  }

  /* Title */
  header {
    text-align: center;
    padding: 80px 20px 48px;
  }
  header h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: clamp(2.4rem, 8vw, 4.4rem);
    letter-spacing: 0.14em;
    line-height: 1.3;
    padding-bottom: 0.1em;
    background: linear-gradient(180deg, #ffffff 0%, #a9dcf7 60%, #6bb8e3 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 4px 24px rgba(124, 198, 238, 0.35));
  }
  .divider {
    width: min(220px, 50%);
    height: 1px;
    margin: 22px auto 18px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.7), transparent);
  }
  header p {
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.2rem;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  /* Grid of mods */
  .layout {
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 24px 80px;
    display: grid;
    grid-template-columns: 230px 1fr;
    gap: 32px;
    align-items: start;
  }
  main {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 28px;
  }
  .empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.25rem;
    color: var(--muted);
  }

  /* Sidebar */
  .sidebar {
    position: sticky;
    top: 24px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid var(--glass-line);
    border-radius: 22px;
    padding: 20px 14px 14px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 18px 40px rgba(0,0,0,0.4);
  }
  .side-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 0 4px 12px;
    margin-bottom: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.14);
  }
  .sidebar h2 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 1.3rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #fff;
  }
  .fav-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font: inherit;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--gold);
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid rgba(240, 196, 106, 0.4);
    background: rgba(240, 196, 106, 0.08);
    cursor: pointer;
    transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .fav-pill:hover, .fav-pill:focus-visible {
    background: rgba(240, 196, 106, 0.18);
    outline: none;
  }
  .fav-pill.active {
    background: linear-gradient(180deg, rgba(255,226,160,0.32) 0%, rgba(240,196,106,0.12) 100%);
    border-color: rgba(240, 196, 106, 0.7);
    box-shadow: inset 0 1px 0 rgba(255,240,200,0.5), 0 0 16px rgba(240,196,106,0.25);
    color: #fff3d6;
  }
  .sidebar nav { display: flex; flex-direction: column; gap: 4px; }
  .cat {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    width: 100%;
    text-align: left;
    font: inherit;
    font-weight: 400;
    letter-spacing: 0.03em;
    color: var(--text);
    padding: 9px 14px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: transparent;
    cursor: pointer;
    transition: background 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .cat .count { color: var(--muted); font-size: 0.85rem; }
  .search { max-width: 440px; margin: 26px auto 0; }
  .search input {
    width: 100%;
    -webkit-appearance: none;
    appearance: none;
    font: inherit;
    font-size: 1rem;
    color: var(--text);
    padding: 13px 24px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, 0.28);
    background: linear-gradient(180deg, rgba(255,255,255,0.16) 0%, rgba(255,255,255,0.05) 100%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    backdrop-filter: blur(16px) saturate(160%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 10px 26px rgba(0,0,0,0.3);
    outline: none;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .search input::placeholder { color: var(--muted); }
  .search input:focus {
    border-color: rgba(124, 198, 238, 0.8);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 10px 26px rgba(0,0,0,0.3), 0 0 22px rgba(124,198,238,0.3);
  }
  .item { position: relative; }
  .item.soon { border-style: dashed; }
  .item.soon img, .item.soon .thumb-fallback { opacity: 0.55; filter: saturate(0.6); }
  .soon-badge {
    position: absolute;
    top: 18px;
    right: 18px;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 0.72rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #fff;
    background: rgba(0, 10, 18, 0.55);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(124, 198, 238, 0.6);
    pointer-events: none;
  }
  .soon-note {
    text-align: center;
    padding: 14px 22px;
    border-radius: 999px;
    border: 1px dashed rgba(124, 198, 238, 0.55);
    background: rgba(124, 198, 238, 0.08);
    color: var(--sky);
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .fav-badge {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    color: var(--gold);
    font-size: 1.05rem;
    background: rgba(0, 10, 18, 0.5);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(240, 196, 106, 0.5);
    pointer-events: none;
  }
  .star {
    position: absolute;
    top: 22px;
    left: 22px;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(0, 10, 18, 0.45);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    color: #fff;
    font-size: 1.35rem;
    line-height: 1;
    cursor: pointer;
    transition: background 0.25s ease, transform 0.25s ease, color 0.25s ease, border-color 0.25s ease;
  }
  .star:hover, .star:focus-visible { transform: scale(1.08); background: rgba(124,198,238,0.3); outline: none; }
  .star.on {
    color: var(--gold);
    border-color: rgba(240, 196, 106, 0.7);
    background: rgba(240, 196, 106, 0.2);
  }
  .cat-divider {
    height: 1px;
    margin: 6px 12px;
    background: rgba(255,255,255,0.14);
  }
  .cat:hover, .cat:focus-visible {
    background: rgba(255,255,255,0.08);
    outline: none;
  }
  .cat.active {
    background: linear-gradient(180deg, rgba(255,255,255,0.24) 0%, rgba(255,255,255,0.06) 55%, rgba(124,198,238,0.16) 100%);
    border-color: rgba(255,255,255,0.32);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 6px 18px rgba(0,0,0,0.3);
    color: #fff;
  }

  @media (max-width: 800px) {
    .layout { grid-template-columns: 1fr; gap: 20px; padding: 0 16px 56px; }
    main { grid-template-columns: 1fr; gap: 22px; }
    header { padding: 48px 16px 28px; }
    header p { font-size: 1.05rem; }
    .sidebar { position: static; padding: 12px; display: flex; align-items: center; gap: 10px; }
    .side-head { padding: 0; margin: 0; border: 0; flex: 0 0 auto; }
    .sidebar h2 { display: none; }
    .sidebar nav { flex: 1; min-width: 0; flex-direction: row; overflow-x: auto; padding-bottom: 2px; }
    .cat { width: auto; white-space: nowrap; flex: 0 0 auto; }
    .cat-divider { width: 1px; height: auto; margin: 4px 2px; flex: 0 0 1px; }
  }
  .item {
    background: var(--glass);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid var(--glass-line);
    border-radius: 22px;
    padding: 10px 10px 8px;
    cursor: pointer;
    text-align: center;
    color: inherit;
    font: inherit;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.18), 0 18px 40px rgba(0,0,0,0.4);
    transition: transform 0.3s ease, border-color 0.3s ease, background 0.3s ease;
  }
  .item:hover, .item:focus-visible {
    transform: translateY(-5px);
    background: rgba(255, 255, 255, 0.11);
    border-color: rgba(160, 215, 245, 0.55);
    outline: none;
  }
  .item img, .thumb-fallback {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 10;
    object-fit: cover;
    border-radius: 14px;
    background: rgba(0, 0, 0, 0.35);
  }
  .thumb-fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 0.9rem;
  }
  .item .name {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 1.35rem;
    letter-spacing: 0.03em;
    padding: 14px 10px 2px;
  }
  .item .price {
    color: var(--gold);
    font-weight: 500;
    letter-spacing: 0.06em;
    padding: 0 10px 2px;
  }
  .item .updated {
    padding: 0 10px 12px;
    color: var(--muted);
    font-size: 0.82rem;
    letter-spacing: 0.06em;
  }

  /* Pop-up */
  dialog {
    background: rgba(8, 26, 40, 0.62);
    -webkit-backdrop-filter: blur(28px) saturate(150%);
    backdrop-filter: blur(28px) saturate(150%);
    color: var(--text);
    border: 1px solid var(--glass-line);
    border-radius: 26px;
    width: min(580px, calc(100% - 32px));
    max-height: calc(100% - 48px);
    margin: auto;
    padding: 12px;
    overflow: auto;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 30px 80px rgba(0,0,0,0.6);
  }
  dialog::backdrop {
    background: rgba(0, 6, 12, 0.7);
    -webkit-backdrop-filter: blur(8px);
    backdrop-filter: blur(8px);
  }
  .modal-img, .modal-img-fallback {
    display: block;
    width: 100%;
    aspect-ratio: 16 / 9;
    object-fit: cover;
    border-radius: 16px;
    background: rgba(0, 0, 0, 0.35);
  }
  .modal-img-fallback {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
  }
  .modal-body { padding: 22px 14px 14px; }
  .modal-body h2 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 1.9rem;
    letter-spacing: 0.03em;
    color: #fff;
    margin-bottom: 4px;
  }
  .modal-body .updated {
    color: var(--muted);
    font-size: 0.85rem;
    letter-spacing: 0.06em;
    margin-bottom: 16px;
  }
  .modal-body .price {
    color: var(--gold);
    font-weight: 500;
    font-size: 1.15rem;
    letter-spacing: 0.06em;
    margin-bottom: 14px;
  }
  .modal-body .desc {
    color: #d3e4f0;
    white-space: pre-line;
    margin-bottom: 24px;
  }

  /* Liquid glass buttons */
  .links { display: flex; flex-direction: column; gap: 12px; }
  .links a {
    display: block;
    text-align: center;
    text-decoration: none;
    font-family: var(--sans);
    font-weight: 500;
    letter-spacing: 0.04em;
    color: #fff;
    padding: 14px 22px;
    border-radius: 999px;
    background: linear-gradient(180deg, rgba(255,255,255,0.26) 0%, rgba(255,255,255,0.07) 55%, rgba(124,198,238,0.16) 100%);
    -webkit-backdrop-filter: blur(16px) saturate(160%);
    backdrop-filter: blur(16px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.32);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.55),
      inset 0 -10px 18px rgba(124,198,238,0.12),
      0 10px 26px rgba(0,0,0,0.38);
    transition: transform 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
  }
  .links a:hover, .links a:focus-visible {
    transform: translateY(-2px);
    background: linear-gradient(180deg, rgba(255,255,255,0.38) 0%, rgba(255,255,255,0.12) 55%, rgba(124,198,238,0.26) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,255,255,0.7),
      inset 0 -10px 18px rgba(124,198,238,0.2),
      0 14px 32px rgba(0,0,0,0.45),
      0 0 26px rgba(124,198,238,0.28);
    outline: none;
  }
  .links a.paid {
    background: linear-gradient(180deg, rgba(255,226,160,0.3) 0%, rgba(240,196,106,0.1) 55%, rgba(240,196,106,0.2) 100%);
    border-color: rgba(240, 196, 106, 0.55);
    color: #fff3d6;
  }
  .links a.paid:hover, .links a.paid:focus-visible {
    background: linear-gradient(180deg, rgba(255,226,160,0.42) 0%, rgba(240,196,106,0.16) 55%, rgba(240,196,106,0.3) 100%);
    box-shadow:
      inset 0 1px 0 rgba(255,240,200,0.7),
      0 14px 32px rgba(0,0,0,0.45),
      0 0 26px rgba(240,196,106,0.3);
  }
  .close {
    position: absolute;
    top: 22px;
    right: 22px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(0, 10, 18, 0.45);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    color: #fff;
    font-size: 1.3rem;
    line-height: 1;
    cursor: pointer;
    transition: background 0.25s ease, transform 0.25s ease;
  }
  .close:hover, .close:focus-visible { background: rgba(124,198,238,0.35); transform: scale(1.06); outline: none; }

  footer .notice {
    font-style: normal;
    font-family: var(--sans);
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--gold);
    max-width: 560px;
    margin: 0 auto 16px;
    padding: 12px 22px;
    border-radius: 999px;
    border: 1px solid rgba(240, 196, 106, 0.4);
    background: rgba(240, 196, 106, 0.08);
  }
  .group-title {
    grid-column: 1 / -1;
    font-family: var(--serif);
    font-weight: 600;
    font-size: 1.6rem;
    letter-spacing: 0.08em;
    color: #fff;
    padding-bottom: 8px;
    margin-top: 10px;
    border-bottom: 1px solid rgba(255,255,255,0.14);
  }
  .group-title:first-child { margin-top: 0; }
  .group-empty {
    grid-column: 1 / -1;
    font-family: var(--serif);
    font-style: italic;
    color: var(--muted);
    padding: 0 4px 8px;
  }
  .gallery { position: relative; }
  .gal-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 44px;
    height: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    padding-bottom: 4px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.3);
    background: rgba(0, 10, 18, 0.45);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    color: #fff;
    font-size: 1.9rem;
    line-height: 1;
    cursor: pointer;
    transition: background 0.25s ease;
  }
  .gal-btn.prev { left: 10px; }
  .gal-btn.next { right: 10px; }
  .gal-btn:hover, .gal-btn:focus-visible { background: rgba(124,198,238,0.35); outline: none; }
  .gallery-dots {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 12px;
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  .gal-dot {
    width: 12px;
    height: 12px;
    padding: 0;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.8);
    background: rgba(255,255,255,0.2);
    cursor: pointer;
  }
  .gal-dot.on { background: #fff; }
  .maint-wrap { position: relative; }
  .links .btn-off {
    display: block;
    text-align: center;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: rgba(255,255,255,0.4);
    padding: 14px 22px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.18);
    background: rgba(255,255,255,0.05);
  }
  .maint-overlay {
    position: absolute;
    inset: -6px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 22px;
    background: rgba(2, 8, 14, 0.5);
    -webkit-backdrop-filter: blur(3px);
    backdrop-filter: blur(3px);
  }
  .maint-overlay span {
    padding: 12px 28px;
    border-radius: 999px;
    border: 1px dashed rgba(240, 196, 106, 0.7);
    background: rgba(240, 196, 106, 0.14);
    color: var(--gold);
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    font-size: 0.95rem;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-family: var(--serif);
    font-style: italic;
    letter-spacing: 0.05em;
    padding: 0 20px 44px;
  }

  @media (max-width: 480px) {
    dialog { width: calc(100% - 20px); max-height: calc(100% - 28px); padding: 8px; border-radius: 22px; }
    .modal-body { padding: 18px 8px 8px; }
    .modal-body h2 { font-size: 1.6rem; }
    .star { top: 16px; left: 16px; }
    .close { top: 16px; right: 16px; }
    .links a { padding: 15px 18px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <h1>Aerofly mods by 89_Gamer</h1>
  <div class="divider"></div>
  <p>Select a mod to see its details and downloads</p>
  <div class="search">
    <input id="search" type="search" placeholder="Search mods..." aria-label="Search mods" autocomplete="off">
  </div>
</header>

<div class="layout">
  <aside class="sidebar">
    <div class="side-head">
      <h2>Browse</h2>
      <button type="button" class="fav-pill" id="favBtn"></button>
    </div>
    <nav id="cats"></nav>
  </aside>
  <main id="grid"></main>
</div>

<footer>
  <p class="notice">Do not share or repost my mods without permission!</p>
  <p id="siteFooter"></p>
</footer>

<dialog id="modal">
  <button class="close" id="closeBtn" aria-label="Close">&times;</button>
  <div id="modalContent"></div>
</dialog>

<script>
/* ================================================================
   EDIT YOUR MODS HERE
   Copy one block { ... }, to add another mod. Keep the commas.

   category: which sidebar category it belongs to. It must be written exactly
             like one of the names in the categories list below.
   image:    the picture file you uploaded to GitHub (exact file name)
   price:    optional. For paid mods, like "€1.99". Leave this line out for free mods.
   version:  the mod's version, like "1.0". Change it when you release an update.
   comingSoon: add  comingSoon: true  for a mod that isn't out yet. It only shows
             under "Coming Soon" (no download buttons). Remove that line when it's released.
   images:   optional. A list of pictures for the pop-up, like ["a.jpg", "b.jpg"].
             With 2 or more pictures, arrow buttons appear to switch between them.
             The card on the main page uses  image  (the first picture).
   maintenance: add  maintenance: true  to switch off this mod's download buttons.
   updated:  the date you last updated the mod, written YEAR-MONTH-DAY
             like "2026-10-18". Change it every time you release a new version.
   links:    each link has a label (button text) and a url.
             Add  paid: true  for Gumroad / paid links (they turn gold).
   ================================================================ */
// Site version: shown at the bottom of the page. It goes up with every update.
const SITE_VERSION = "1.9";

const categories = ["Scenery", "Pushback slots", "Liveries"];

// Download buttons are switched off and show "Maintenance" for these categories.

const grid = document.getElementById("grid");
const modal = document.getElementById("modal");
const modalContent = document.getElementById("modalContent");

function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  Object.assign(node, props);
  children.forEach(c => node.append(c));
  return node;
}

function picture(src, alt, imgClass, fallbackClass) {
  const img = el("img", { src, alt, loading: "lazy" });
  img.className = imgClass;
  img.onerror = () => {
    const fb = el("div", { textContent: "No picture yet" });
    fb.className = fallbackClass;
    img.replaceWith(fb);
  };
  return img;
}

function metaText(mod, long) {
  const parts = [];
  if (mod.version) parts.push((long ? "Version " : "v") + mod.version);
  if (mod.updated) parts.push(updatedText(mod));
  return parts.join(" \u00b7 ");
}

function updatedText(mod) {
  if (!mod.updated) return "";
  const d = new Date(mod.updated + "T00:00:00Z");
  if (isNaN(d)) return "Updated " + mod.updated;
  return "Updated " + d.toLocaleDateString("en-GB", {
    day: "numeric", month: "short", year: "numeric", timeZone: "UTC"
  });
}

const catsNav = document.getElementById("cats");
const favBtn = document.getElementById("favBtn");
const searchBox = document.getElementById("search");
document.getElementById("siteFooter").textContent = "Aerofly mods by 89_Gamer \u00b7 Site v" + SITE_VERSION;
const ALL = "All Releases";
const RECENT = "Recently Updated";
const FAV = "Favourites";
const COMING = "Coming Soon";

// Favourites are saved in the visitor's own browser (they don't sync between devices)
function loadFavs() {
  try { return new Set(JSON.parse(localStorage.getItem("fav-mods") || "[]")); }
  catch (e) { return new Set(); }
}
function saveFavs() {
  try { localStorage.setItem("fav-mods", JSON.stringify([...favs])); }
  catch (e) { /* storage blocked: favourites just won't be remembered */ }
}
const favs = loadFavs();
function toggleFav(mod) {
  if (favs.has(mod.name)) favs.delete(mod.name); else favs.add(mod.name);
  saveFavs();
}
let currentCategory = ALL;

function isRecent(mod) {
  if (mod.comingSoon || !mod.updated) return false;
  const d = new Date(mod.updated + "T00:00:00Z");
  if (isNaN(d)) return false;
  return Date.now() - d.getTime() <= RECENT_DAYS * 24 * 60 * 60 * 1000;
}

function getShown() {
  const q = searchBox.value.trim().toLowerCase();
  if (q) {
    // searching looks through every mod, whatever menu option is selected
    return mods.filter(m =>
      (m.name + " " + (m.description || "") + " " + (m.category || "")).toLowerCase().includes(q));
  }
  if (currentCategory === COMING) return mods.filter(m => m.comingSoon);
  const live = mods.filter(m => !m.comingSoon);
  if (currentCategory === ALL) return live;
  if (currentCategory === FAV) return live.filter(m => favs.has(m.name));
  if (currentCategory === RECENT) {
    // newest update first; for the same date, the most recently added mod first
    return mods
      .map((mod, i) => ({ mod, i }))
      .filter(x => isRecent(x.mod))
      .sort((a, b) => (b.mod.updated.localeCompare(a.mod.updated)) || (b.i - a.i))
      .map(x => x.mod);
  }
  return live.filter(m => m.category === currentCategory);
}

function addCatButton(name, count) {
  const btn = el("button", { type: "button" }, [
    el("span", { textContent: name }),
    el("span", { className: "count", textContent: String(count) })
  ]);
  btn.className = "cat" + (name === currentCategory ? " active" : "");
  btn.addEventListener("click", () => {
    currentCategory = name;
    renderSidebar();
    renderGrid();
  });
  catsNav.append(btn);
}

function renderSidebar() {
  const live = mods.filter(m => !m.comingSoon);
  const favCount = live.filter(m => favs.has(m.name)).length;
  favBtn.textContent = "\u2605 " + favCount;
  favBtn.className = "fav-pill" + (currentCategory === FAV ? " active" : "");
  favBtn.title = "Favourites";
  favBtn.setAttribute("aria-label", "Favourites (" + favCount + ")");
  favBtn.setAttribute("aria-pressed", String(currentCategory === FAV));
  catsNav.replaceChildren();
  addCatButton(ALL, live.length);
  addCatButton(RECENT, mods.filter(isRecent).length);
  addCatButton(COMING, mods.filter(m => m.comingSoon).length);
  catsNav.append(el("div", { className: "cat-divider" }));
  categories.forEach(name => {
    addCatButton(name, live.filter(m => m.category === name).length);
  });
}

function makeCard(mod) {
  const card = el("button", { type: "button" });
  card.className = "item" + (mod.comingSoon ? " soon" : "");
  card.append(
    picture(mod.image, mod.name, "", "thumb-fallback"),
    el("div", { className: "name", textContent: mod.name })
  );
  if (mod.comingSoon) {
    card.append(el("span", { className: "soon-badge", textContent: "Coming soon" }));
  } else {
    if (mod.price) card.append(el("div", { className: "price", textContent: mod.price }));
    if (metaText(mod)) card.append(el("div", { className: "updated", textContent: metaText(mod) }));
    if (favs.has(mod.name)) card.append(el("span", { className: "fav-badge", textContent: "\u2605" }));
  }
  card.addEventListener("click", () => openMod(mod));
  return card;
}

function renderGrid() {
  grid.replaceChildren();
  const searching = searchBox.value.trim() !== "";

  // Coming Soon is split into one section per category
  if (currentCategory === COMING && !searching) {
    const soon = mods.filter(m => m.comingSoon);
    if (soon.length === 0) {
      grid.append(el("div", { className: "empty", textContent: "Nothing coming soon right now." }));
      return;
    }
    const groups = categories.map(c => [c, soon.filter(m => m.category === c)]);
    const others = soon.filter(m => !categories.includes(m.category));
    if (others.length) groups.push(["Other", others]);
    groups.forEach(([name, items]) => {
      grid.append(el("h3", { className: "group-title", textContent: name }));
      if (items.length === 0) {
        grid.append(el("div", { className: "group-empty", textContent: "Nothing coming soon here yet." }));
      } else {
        items.forEach(m => grid.append(makeCard(m)));
      }
    });
    return;
  }

  const shown = getShown();
  if (shown.length === 0) {
    const msg = searching ? "No mods found."
      : currentCategory === RECENT ? "No recent updates yet."
      : currentCategory === COMING ? "Nothing coming soon right now."
      : currentCategory === FAV ? "No favourites yet. Open a mod and press the star."
      : "Nothing here yet. Coming soon.";
    grid.append(el("div", { className: "empty", textContent: msg }));
    return;
  }
  shown.forEach(mod => grid.append(makeCard(mod)));
}

searchBox.addEventListener("input", renderGrid);

favBtn.addEventListener("click", () => {
  currentCategory = currentCategory === FAV ? ALL : FAV;
  renderSidebar();
  renderGrid();
});

renderSidebar();
renderGrid();

let galleryStep = null;

function buildGallery(mod) {
  const pics = (mod.images && mod.images.length) ? mod.images : [mod.image];
  if (pics.length < 2) return picture(pics[0], mod.name, "modal-img", "modal-img-fallback");
  let i = 0;
  const wrap = el("div", { className: "gallery" });
  const stage = el("div", { className: "gallery-stage" });
  const dots = el("div", { className: "gallery-dots" });
  const show = n => {
    i = (n + pics.length) % pics.length;
    stage.replaceChildren(picture(pics[i], mod.name + " (" + (i + 1) + " of " + pics.length + ")", "modal-img", "modal-img-fallback"));
    [...dots.children].forEach((d, k) => d.classList.toggle("on", k === i));
  };
  const arrow = (label, text, dir) => {
    const b = el("button", { type: "button", textContent: text });
    b.className = "gal-btn " + (dir < 0 ? "prev" : "next");
    b.setAttribute("aria-label", label);
    b.addEventListener("click", () => show(i + dir));
    return b;
  };
  pics.forEach((_, k) => {
    const d = el("button", { type: "button" });
    d.className = "gal-dot";
    d.setAttribute("aria-label", "Picture " + (k + 1));
    d.addEventListener("click", () => show(k));
    dots.append(d);
  });
  wrap.append(stage, arrow("Previous picture", "\u2039", -1), arrow("Next picture", "\u203a", 1), dots);
  // swipe left or right on a phone
  let x0 = null;
  stage.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 40) show(i + (dx < 0 ? 1 : -1));
    x0 = null;
  });
  galleryStep = dir => show(i + dir);
  show(0);
  return wrap;
}

function openMod(mod) {
  galleryStep = null;
  modalContent.replaceChildren();
  const maint = isMaintenance(mod);
  const links = el("div", { className: "links" });
  (mod.links || []).forEach(l => {
    if (maint) {
      // switched off: not a link, nothing to click
      const off = el("span", { textContent: l.label });
      off.className = "btn-off";
      off.setAttribute("aria-disabled", "true");
      links.append(off);
      return;
    }
    const a = el("a", { href: l.url, textContent: l.label, target: "_blank", rel: "noopener" });
    if (l.paid) a.classList.add("paid");
    if (!/^https?:/i.test(l.url)) { a.removeAttribute("target"); a.setAttribute("download", ""); }
    links.append(a);
  });
  const body = el("div", { className: "modal-body" }, [el("h2", { textContent: mod.name })]);
  if (!mod.comingSoon && metaText(mod, true)) body.append(el("p", { className: "updated", textContent: metaText(mod, true) }));
  if (mod.price) body.append(el("p", { className: "price", textContent: mod.price }));
  body.append(el("p", { className: "desc", textContent: mod.description }));
  let linksBlock = links;
  if (maint && !mod.comingSoon) {
    linksBlock = el("div", { className: "maint-wrap" }, [
      links,
      el("div", { className: "maint-overlay" }, [el("span", { textContent: "Maintenance" })])
    ]);
  }
  body.append(mod.comingSoon ? el("div", { className: "soon-note", textContent: "Coming soon" }) : linksBlock);
  const star = el("button", { type: "button" });
  const paintStar = () => {
    const on = favs.has(mod.name);
    star.className = "star" + (on ? " on" : "");
    star.textContent = on ? "\u2605" : "\u2606";
    star.setAttribute("aria-pressed", String(on));
    star.setAttribute("aria-label", on ? "Remove from favourites" : "Add to favourites");
    star.title = on ? "Remove from favourites" : "Add to favourites";
  };
  paintStar();
  star.addEventListener("click", () => {
    toggleFav(mod);
    paintStar();
    renderSidebar();
    renderGrid();
  });
  modalContent.append(buildGallery(mod), body);
  if (!mod.comingSoon) modalContent.append(star);
  modal.showModal();
}

document.getElementById("closeBtn").addEventListener("click", () => modal.close());
modal.addEventListener("keydown", e => {
  if (!galleryStep) return;
  if (e.key === "ArrowLeft") galleryStep(-1);
  if (e.key === "ArrowRight") galleryStep(1);
});
modal.addEventListener("click", e => { if (e.target === modal) modal.close(); });
